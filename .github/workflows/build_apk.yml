name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8512546
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar estrutura nativa Android
        run: flutter create . --org com.concursoweb --project-name concurso_app

      - name: Forçar SDK 36 nos arquivos gerados
        run: |
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle || true

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Salvar APK nos Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recriar estrutura Android limpa
        run: |
          rm -rf android
          flutter create . --org com.concursoweb --project-name concurso_app --platforms android

      - name: Injetar compileSdk 36 no build.gradle do app
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle || true

      - name: Injetar compileSdk 36 no settings.gradle (Flutter moderno)
        run: |
          if [ -f android/settings.gradle ]; then
            echo 'gradle.projectsEvaluated { subprojects { plugins.withType(com.android.build.gradle.BasePlugin) { android { compileSdkVersion 36 } } } }' >> android/build.gradle
          fi

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Salvar APK nos Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

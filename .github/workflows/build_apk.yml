name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Criar Projeto Android Completo
        run: flutter create . --org com.concursoweb --project-name concurso_app

      - name: Atualizar compileSdk para 36
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/targetSdk = .*/targetSdk = 36/' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Salvar APK nos Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
